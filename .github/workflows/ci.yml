name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -s sh scripts/usage-guard.sh tests/run.sh
      - name: JSON manifests
        run: jq -e . .claude-plugin/plugin.json .claude-plugin/marketplace.json hooks/hooks.json > /dev/null

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Script tests
        run: sh tests/run.sh
      - name: Script tests under dash
        if: runner.os == 'macOS'
        run: TEST_SH=dash sh tests/run.sh
